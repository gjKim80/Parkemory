<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Parkemory — 3D 주차 메모리</title>
  <meta name="description" content="Parkemory: 3D 실린더 타워로 주차 위치를 저장하는 스마트 모바일 웹앱">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app-root">

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">P</div>
      <div>
        <div class="brand-name">PARKEMORY</div>
        <div class="brand-sub">Parking + Memory</div>
      </div>
    </div>
    <div class="header-btns">
      <button id="btnSound" class="btn-pill">Sound</button>
      <button id="btnSettings" class="btn-pill accent">설정</button>
    </div>
  </header>

  <!-- Sync Bar -->
  <div class="sync-bar">
    <div class="sync-live">
      <span class="sync-dot"></span> 2인 실시간 동기화
    </div>
    <button id="btnSync" class="btn-pill" style="padding:4px 9px;font-size:.72rem;">
      공유코드: <strong id="lblRoom" style="color:#fbbf24;">PARK-2026</strong>
    </button>
  </div>

  <!-- Active Vehicle Card -->
  <div class="vehicle-card">
    <div class="vc-left">
      <div class="vc-thumb"><img id="vcImg" src="./assets/cars/benz_silver.png" alt="차량"></div>
      <div>
        <div id="vcName" class="vc-name">벤츠 E클래스</div>
        <div id="vcPlate" class="vc-plate">163어 3938</div>
      </div>
    </div>
    <div>
      <div class="vc-place-label">자주 가는 장소</div>
      <div id="vcPlace" class="vc-place">우리집 지하주차장</div>
    </div>
  </div>

  <!-- 3D Building Tower Canvas -->
  <div class="building-section">
    <div class="building-label">
      <span>3D ISOMETRIC BUILDING TOWER</span>
      <span style="color:var(--cyan);font-size:.72rem;">층 선택 → 서랍 입차</span>
    </div>
    <div class="building-canvas-wrapper">
      <canvas id="buildingCanvas"></canvas>
    </div>
  </div>

  <!-- Floor Drawer List -->
  <div id="floorList" class="floor-list"></div>

</div><!-- /app-root -->

<!-- Modal: Settings + Vehicle Management -->
<div id="modalSettings" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">설정 및 차량 관리</div>
      <button id="btnCloseSettings" class="modal-close">✕</button>
    </div>

    <div class="panel-group">
      <label class="panel-label">자주 주차하는 장소명</label>
      <input id="inputPlace" class="panel-input" type="text" placeholder="예: 우리집 지하주차장, 회사 타워">
    </div>

    <div class="panel-group" style="margin-top:14px;">
      <label class="panel-label" style="display:flex;justify-content:space-between;">
        <span>등록된 차량 목록</span>
        <span style="font-size:.68rem;color:var(--muted);">선택 / 삭제 가능</span>
      </label>
      <div id="vehList"></div>
    </div>

    <button id="btnToggleAddVeh" class="btn-pill accent" style="width:100%;justify-content:center;margin:8px 0 12px;">
      새 차량 추가하기
    </button>

    <div id="addVehForm" class="add-veh-form hidden">
      <div class="panel-group">
        <label class="panel-label">차량 별명 / 모델명</label>
        <input id="inputVehName" class="panel-input" type="text" placeholder="예: 벤츠 E클래스, 카니발, 레이">
      </div>
      <div class="panel-group">
        <label class="panel-label">차량 번호</label>
        <input id="inputVehPlate" class="panel-input" type="text" placeholder="예: 163어 3938">
      </div>
      <button id="btnAddVeh" class="btn-park" style="margin-top:4px;">차량 등록</button>
    </div>

    <button id="btnSaveSettings" class="btn-park" style="margin-top:6px;">저장 완료</button>
  </div>
</div>

<!-- Modal: Sync Code -->
<div id="modalSync" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">2인 공유 동기화 설정</div>
      <button id="btnCloseSync" class="modal-close">✕</button>
    </div>
    <p style="font-size:.84rem;color:var(--muted);margin-bottom:14px;line-height:1.5;">
      두 사람이 동일한 코드를 입력하면 서로의 주차 위치가 실시간으로 반영됩니다.
    </p>
    <div class="panel-group">
      <label class="panel-label">공유 비밀 코드</label>
      <input id="inputSyncCode" class="panel-input" type="text" value="PARK-2026"
        style="text-transform:uppercase;font-family:var(--font-num);font-size:1.05rem;">
    </div>
    <button id="btnSaveSync" class="btn-park" style="margin-top:6px;">코드 적용</button>
  </div>
</div>

<script src="./js/sound.js"></script>
<script src="./js/sync.js"></script>
<script src="./js/building.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
